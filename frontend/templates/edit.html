<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование книги</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Редактирование книги</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="book-form">
            <div class="form-group">
                <label>Название книги *</label>
                <input type="text" name="title" value="{{ book.title }}" required>
            </div>

            <div class="form-group">
                <label>Автор *</label>
                <input type="text" name="author" value="{{ book.author }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Год издания *</label>
                    <input type="number" name="year" value="{{ book.year }}" required>
                </div>
                <div class="form-group">
                    <label>Количество страниц *</label>
                    <input type="number" name="pages" value="{{ book.pages }}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Издательство *</label>
                <input type="text" name="publisher" value="{{ book.publisher }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>ISBN *</label>
                    <input type="text" name="isbn" value="{{ book.isbn }}" required>
                </div>
                <div class="form-group">
                    <label>Количество экземпляров *</label>
                    <input type="number" name="quantity" value="{{ book.quantity }}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Жанр *</label>
                <select name="genre" required>
                    <option value="">Выберите жанр</option>
                    <option value="Роман" {% if book.genre == "Роман" %}selected{% endif %}>Роман</option>
                    <option value="Детектив" {% if book.genre == "Детектив" %}selected{% endif %}>Детектив</option>
                    <option value="Фантастика" {% if book.genre == "Фантастика" %}selected{% endif %}>Фантастика</option>
                    <option value="Фэнтези" {% if book.genre == "Фэнтези" %}selected{% endif %}>Фэнтези</option>
                    <option value="Научная литература" {% if book.genre == "Научная литература" %}selected{% endif %}>Научная литература</option>
                    <option value="Поэзия" {% if book.genre == "Поэзия" %}selected{% endif %}>Поэзия</option>
                    <option value="Драма" {% if book.genre == "Драма" %}selected{% endif %}>Драма</option>
                    <option value="Приключения" {% if book.genre == "Приключения" %}selected{% endif %}>Приключения</option>
                    <option value="Триллер" {% if book.genre == "Триллер" %}selected{% endif %}>Триллер</option>
                    <option value="Ужасы" {% if book.genre == "Ужасы" %}selected{% endif %}>Ужасы</option>
                    <option value="Биография" {% if book.genre == "Биография" %}selected{% endif %}>Биография</option>
                    <option value="История" {% if book.genre == "История" %}selected{% endif %}>История</option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">Сохранить изменения</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</body>
</html>
